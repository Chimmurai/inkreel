name: tests

on:
  push:
    branches: [main, beta]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      QT_QPA_PLATFORM: offscreen      # the window is tested without a screen
      INKREEL_GPU: "off"              # runners have no graphics card
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt pytest
      - name: Tests (everything except the long video and pool tests)
        run: python -m pytest -m "not slow" -q -p no:cacheprovider -o faulthandler_timeout=300
